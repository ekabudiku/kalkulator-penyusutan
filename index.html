<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Penyusutan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      padding: 16px;
      cursor: pointer;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      display: block;
    }

    .tap-hint {
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      text-align: center;
      padding: 8px 16px;
      background: rgba(30, 41, 59, 0.7);
      border-radius: 9999px;
      backdrop-filter: blur(4px);
      transition: opacity 0.3s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <main class="container">
    <img 
      src="happy-cat.gif" 
      alt="Happy Cat"
    >
    <div id="hint" class="tap-hint">Klik di mana saja untuk putar lagu 🎵</div>
  </main>

  <audio id="my-audio" src="sound.mp3" loop preload="auto"></audio>

  <script>
    const audio = document.getElementById('my-audio');
    const hint = document.getElementById('hint');
    let isPlayed = false;

    function playAudio() {
      if (!isPlayed) {
        audio.play().then(() => {
          isPlayed = true;
          hint.classList.add('hidden');
        }).catch(err => {
          console.log("Menunggu interaksi pengguna:", err);
        });
      }
    }

    document.body.addEventListener('click', playAudio, { once: true });
    document.body.addEventListener('touchstart', playAudio, { once: true });
  </script>
</body>
</html>
